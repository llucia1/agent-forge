version: "3.8"

services:
  agent-forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-forge
    restart: unless-stopped
    user: "${AGENTFORGE_UID:-1000}:${AGENTFORGE_GID:-1000}"
    working_dir: /app
    volumes:
      - ./development_agents:/app
      - ./workspaces:/workspaces
    env_file:
      - .env
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      AGENTFORGE_QA_EXECUTABLE_POLICY: ${AGENTFORGE_QA_EXECUTABLE_POLICY:-{}}
      AGENTFORGE_QA_CHECKS: ${AGENTFORGE_QA_CHECKS:-[]}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - app_net

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.94.2
    container_name: agent-forge-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - .env.litellm
    depends_on:
      ollama:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net

  ollama:
    image: ollama/ollama:0.32.5
    container_name: agent-forge-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_net

  postgres:
    image: postgres:17-alpine
    container_name: agent-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./development_agents/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: agent-forge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_models:

networks:
  app_net:
    driver: bridge
